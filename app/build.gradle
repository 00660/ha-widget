plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wight.hawidget'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.wight.hawidget'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
